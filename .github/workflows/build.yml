name: Build Mod Menu

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: Install Dependencies
        run: brew install ldid dpkg gettext

      - name: Compile
        run: |
          make clean || true
          make FINALPACKAGE=1

      - name: Collect artifacts
        run: |
          mkdir -p output
          find . -name "*.dylib" -not -path "./.git/*" -exec cp -v {} output/ \;
          find . -name "*.deb"   -not -path "./.git/*" -exec cp -v {} output/ \;
          echo "--- output ---"
          ls -la output/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: IdleGongfu-ModMenu
          path: output/*
          if-no-files-found: error
          retention-days: 30
